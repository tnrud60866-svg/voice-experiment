<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>실험</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #fff;
    color: #151515;
    font-family: -apple-system, BlinkMacSystemFont,
      'Noto Sans KR', sans-serif;
    overflow: hidden;
  }

  body { touch-action: manipulation; }

  .screen {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
  }

  .card {
    width: min(880px, 100%);
    text-align: center;
  }

  .guide {
    white-space: pre-line;
    font-size: clamp(18px, 2.8vw, 25px);
    line-height: 1.7;
  }

  .row {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 20px;
    flex-wrap: wrap;
  }

  input {
    width: min(360px, 100%);
    font-size: 20px;
    padding: 14px 18px;
    border: 1px solid #ccc;
    border-radius: 12px;
  }

  button {
    font-size: 20px;
    padding: 14px 24px;
    background: #111;
    color: #fff;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
  }

  .hidden { display: none !important; }

  .sentence {
    width: 100%;
    text-align: center;
    white-space: nowrap;
    font-size: 84px;
    line-height: 1.2;
    font-weight: 700;
    overflow: hidden;
  }

  #trial {
    -webkit-user-select: none;
    user-select: none;
  }

  .end-text {
    font-size: clamp(32px, 5vw, 60px);
    line-height: 1.6;
    white-space: pre-line;
    font-weight: 800;
  }
</style>
</head>
<body>

<section id="start" class="screen">
  <div class="card">
    <div class="guide">음성 실험 참여에 감사드립니다.

잠시 휴식 후 다음 실험으로 넘어가겠습니다.</div>

    <div class="row">
      <input
        id="participantInitial"
        type="text"
        autocomplete="off"
        placeholder="이니셜을 입력해 주세요"
      >
      <button id="startBtn" type="button">시작하기</button>
    </div>
  </div>
</section>

<section id="trial" class="screen hidden">
  <div id="sentence" class="sentence"></div>
</section>

<section id="end" class="screen hidden">
  <div class="card">
    <div class="end-text">실험이 종료되었습니다.
감사합니다.</div>

    <div class="row">
      <button id="downloadAgain" type="button">파일 다시 저장</button>
    </div>

    <div style="margin-top:24px;">
      <a
        href="./index.html"
        style="font-size:16px; color:#555; text-decoration:none;"
      >다음 실험 선택하기</a>
    </div>
  </div>
</section>

<script>
const RAW_ITEMS = [
  {"id":"a1","sentence":"다음은 일부보증 입니다"},
  {"id":"a2","sentence":"다음은 정보부대 입니다"},
  {"id":"a3","sentence":"다음은 순수소설 입니다"},
  {"id":"a4","sentence":"다음은 불소수지 입니다"},
  {"id":"a5","sentence":"다음은 명주조개 입니다"},
  {"id":"a6","sentence":"다음은 구조주의 입니다"},
  {"id":"a7","sentence":"다음은 연구고민 입니다"},
  {"id":"a8","sentence":"다음은 밤고구마 입니다"},
  {"id":"a9","sentence":"다음은 가부장적 입니다"},
  {"id":"a10","sentence":"다음은 거수경례 입니다"},
  {"id":"a11","sentence":"다음은 다주택자 입니다"},
  {"id":"a12","sentence":"다음은 개구쟁이 입니다"},
  {"id":"a13","sentence":"다음은 구명부표 입니다"},
  {"id":"a14","sentence":"다음은 뇌하수체 입니다"},
  {"id":"a15","sentence":"다음은 기념주화 입니다"},
  {"id":"a16","sentence":"다음은 반영구적 입니다"},
  {"id":"a17","sentence":"다음은 정보기관 입니다"},
  {"id":"a18","sentence":"다음은 저소득층 입니다"},
  {"id":"a19","sentence":"다음은 위조지폐 입니다"},
  {"id":"a20","sentence":"다음은 간고등어 입니다"},
  {"id":"a21","sentence":"다음은 금은보화 입니다"},
  {"id":"a22","sentence":"다음은 대하소설 입니다"},
  {"id":"a23","sentence":"다음은 비상조치 입니다"},
  {"id":"a24","sentence":"다음은 기말고사 입니다"}
];

let participantInitial = "";
let trials = [];
let index = 0;
let saved = false;

function shuffle(array) {
  const a = array.slice();

  for (let n = a.length - 1; n > 0; n--) {
    const j = Math.floor(Math.random() * (n + 1));
    [a[n], a[j]] = [a[j], a[n]];
  }

  return a;
}

function showOnly(id) {
  ["start", "trial", "end"].forEach(screenId => {
    document.getElementById(screenId).classList.toggle(
      "hidden",
      screenId !== id
    );
  });
}

function startExperiment() {
  const input = document.getElementById("participantInitial");
  const value = input.value.trim();

  if (!value) {
    alert("이니셜을 입력해 주세요.");
    return;
  }

  input.blur();
  participantInitial = value;

  // 전체 24문장을 시작할 때 한 번 섞기
  trials = shuffle(RAW_ITEMS).map((item, n) => ({
    ...item,
    order: n + 1
  }));

  index = 0;
  saved = false;

  showOnly("trial");
  showTrial();
}

function fitSentenceText() {
  const el = document.getElementById("sentence");

  if (!el.textContent ||
      document.getElementById("trial").classList.contains("hidden")) {
    return;
  }

  let size = 84;
  el.style.fontSize = size + "px";

  while (el.scrollWidth > el.clientWidth && size > 14) {
    size -= 1;
    el.style.fontSize = size + "px";
  }
}

function showTrial() {
  const trial = trials[index];
  if (!trial) return;

  document.getElementById("sentence").textContent = trial.sentence;
  fitSentenceText();
}

function nextTrial() {
  if (document.getElementById("trial").classList.contains("hidden")) {
    return;
  }

  index += 1;

  if (index >= trials.length) {
    finishExperiment();
  } else {
    showTrial();
  }
}

function previousTrial() {
  if (document.getElementById("trial").classList.contains("hidden")) {
    return;
  }

  if (index <= 0) return;

  index -= 1;
  showTrial();
}

function handleScreenTap(e) {
  const bounds = e.currentTarget.getBoundingClientRect();
  const middle = bounds.left + bounds.width / 2;

  if (e.clientX >= middle) {
    nextTrial();
  } else {
    previousTrial();
  }
}

function safeFilename(name) {
  return (name || "participant")
    .replace(/[\\/:*?"<>|]/g, "_")
    .trim() || "participant";
}

function downloadOrder() {
  const rows = trials.map(trial => {
    const sentence = trial.sentence.replace(/"/g, '""');
    return `${trial.order},${trial.id},"${sentence}"`;
  });

  const csv = "order,id,sentence\n" + rows.join("\n");

  // Excel에서 한글이 깨지지 않도록 BOM 추가
  const blob = new Blob(["\uFEFF", csv], {
    type: "text/csv;charset=utf-8;"
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = safeFilename(participantInitial) + ".csv";

  document.body.appendChild(a);
  a.click();

  setTimeout(() => {
    URL.revokeObjectURL(url);
    a.remove();
  }, 1000);
}

function finishExperiment() {
  showOnly("end");

  if (!saved) {
    saved = true;
    downloadOrder();
  }
}

document.getElementById("startBtn")
  .addEventListener("click", startExperiment);

document.getElementById("participantInitial")
  .addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      startExperiment();
    }
  });

document.getElementById("trial")
  .addEventListener("click", handleScreenTap);

document.getElementById("downloadAgain")
  .addEventListener("click", downloadOrder);

window.addEventListener("resize", fitSentenceText);
</script>
</body>
</html>
